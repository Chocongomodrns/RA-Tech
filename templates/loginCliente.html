{% extends "base.html" %}

{% block title %}Registro de Clientes - CompuZone{% endblock %}

{% block content %}
  <h1>Iniciar sesión</h1>
  <p>Bienvenido al portal de inicio de sesión de <strong>RA-Tech</strong>, tu tienda especializada en hardware, periféricos y soluciones de tecnología.</p>

  <form action="{{ url_for('login') }}" method="POST" id="clienteDatos">
    <div class="form-panel row">
      <div class="col-md-6">
        <label for="correo">Correo electrónico:</label>
        <input type="email" id="correo" name="correo" class="form-control" required>

        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password" class="form-control" required>

        <button type="submit" class="btn btn-custom mt-4 btn-block">Iniciar Sesión</button>
      </div>
    </div>
  </form>
{% endblock %}
