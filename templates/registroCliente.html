{% extends "base.html" %}

{% block title %}Registro de Clientes - CompuZone{% endblock %}

{% block content %}
  <h1>Registro de Clientes - CompuZone</h1>
  <p>Bienvenido al portal de registro de clientes de <strong>RA-Tech</strong>, tu tienda especializada en hardware, periféricos y soluciones de tecnología.</p>

  <form action="{{ url_for('registroCliente') }}" method="POST" id="clienteDatos">
    <div class="form-panel row">
      <div class="col-md-6">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" class="form-control" required>

        <label for="apellidos">Apellidos:</label>
        <input type="text" id="apellidos" name="apellidos" class="form-control" required>

        <label for="direccion">Dirección:</label>
        <input type="text" id="direccion" name="direccion" class="form-control">
      </div>
      <div class="col-md-6">
        <label for="correo">Correo electrónico:</label>
        <input type="email" id="correo" name="correo" class="form-control" required>

        <label for="telefono">Teléfono:</label>
        <input type="text" id="telefono" name="telefono" class="form-control">

        <button type="submit" class="btn btn-custom mt-4 btn-block">Registrar</button>
      </div>
    </div>
  </form>
{% endblock %}
