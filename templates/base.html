<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CompuZone{% endblock %}</title>

  <!-- Bootstrap -->
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">

  <!-- Estilos personalizados -->
  <link href="{{ url_for('static', filename='css/estilos.css')}}" rel="stylesheet">
</head>

<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg fixed-top">
    <div class="container">
      <a class="navbar-brand" href="{{ url_for('home') }}">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="CompuZone Logo" class="nav-img">
      </a>

      <div class="ml-auto">
        {% if 'correo' in session %}
          <a href="{{ url_for('miPerfil') }}" class="btn btn-outline-success mr-2">Mi Perfil</a>
          <a href="{{ url_for('logout') }}" class="btn btn-danger">Cerrar sesión</a>
        {% else %}
          <a href="{{ url_for('login') }}" class="btn btn-outline-primary mr-2">Iniciar sesión</a>
          <a href="{{ url_for('registroCliente') }}" class="btn btn-primary">Registrarse</a>
        {% endif %}
      </div>
    </div>
  </nav>

  <!-- Contenido principal -->
  <main class="container my-5 main">
    {% block content %}
    {% endblock %}
  </main>

  <!-- Footer -->
  <footer class="page-footer">
    © 2025 CompuZone - Todos los derechos reservados
  </footer>

  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
  <script src="{{ url_for('static', filename='java.js') }}"></script>
</body>
</html>
