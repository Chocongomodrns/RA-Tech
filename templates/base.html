<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CompuZone{% endblock %}</title>

  <!-- Bootstrap -->
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">

  <!-- Estilos personalizados -->
  <link href="{{ url_for('static', filename='css/estilos.css')}}" rel="stylesheet">

</head>

<body>
  <!-- Navbar -->
  <nav class="navbar fixed-top">
    <div class="container">
      <a class="navbar-img" href="{{ url_for('home') }}">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="RA-Tech Logo" class="nav-img">
      </a>
    </div>
  </nav>

  <!-- Contenido principal -->
  <main class="container my-5 main">
    {% block content %}
    {% endblock %}
  </main>

  <!-- Footer -->
  <footer class="page-footer">
    © 2025 CompuZone - Todos los derechos reservados
  </footer>

  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
  <script src="{{ url_for('static', filename='java.js') }}"></script>
</body>
</html>
