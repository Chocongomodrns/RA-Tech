{% extends "base.html" %}

{% block title %}Agregar Productos - RA-Tech{% endblock %}

{% block content %}
    <div class = "container md-6">
    <h1>Agregar nuevo producto</h1>
        <form method="POST">
            <div class = "form-panel row">
                <label>Nombre:</label>
                <input type="text" name="nombre" class="form-control-2" required>

                <label>Precio:</label>
                <input type="number" step="0.01" name="precio" class="form-control-2" required >

                <label>Stock:</label>
                <input type="number" name="stock" class="form-control-2" required>

                <label>Nombre de archivo de imagen (ej: fuente.png):</label>
                <input type="text" name="imagen" class="form-control-2" required>

                <button type="submit" class="btn btn-custom  mt-4">Agregar</button>

            </div>
        </form>
    </div>
{% endblock %}
