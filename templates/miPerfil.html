{% extends "base.html" %}

{% block title %}Mi Perfil{% endblock %}

{% block content %}
<div class="container mt-5">
  <div class="card shadow-sm">
    <div class="card-header bg-primary text-white">
      <h4 class="mb-0">Mi Perfil</h4>
    </div>
    <div class="card-body">
      <form method="POST" action="/actualizar_datos" id="perfil-form">
        <div class="mb-3">
          <label><strong>Nombre:</strong></label>
          <input type="text" name="nombre" value="{{ nombre or '' }}" class="form-control-2">
        </div>
        <div class="mb-3">
          <label><strong>Apellidos:</strong></label>
          <input type="text" name="apellidos" value="{{ apellidos or '' }}" class="form-control-2">
        </div>
        <div class="mb-3">
          <label><strong>Teléfono:</strong></label>
          <input type="text" name="telefono" value="{{ telefono or '' }}" class="form-control-2">
        </div>
        <div class="mb-3">
          <label><strong>Dirección:</strong></label>
          <input type="text" name="direccion" value="{{ direccion or '' }}" class="form-control-2">
        </div>
        <div class="mb-3">
          <label><strong>Correo:</strong></label>
          <input type="email" name = "correo" value="{{ correo or '' }}" class="form-control-2" readonly>
        </div>

        <div class="d-flex gap-2">
          <button type="button" class="btn btn-custom" id = "editar-btn" onclick="activarEdicion()">Editar</button>
          <button type="submit" class="btn btn-success" id="confirmar-btn" style="display: none;">Confirmar</button>
          <button type="button" class="btn btn-secondary" onclick="cancelarEdicion()" id="cancelar-btn" style="display: none;">Cancelar</button>
          <a href="{{ url_for('logout') }}" id = "logout-btn" class="btn btn-danger ms-auto">Cerrar sesión</a>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
  // Al cargar la página, todos los campos se bloquean excepto el correo que ya es readonly
  document.addEventListener("DOMContentLoaded", () => {
    activarLectura();
  });

  function activarLectura() {
    document.querySelectorAll('input.form-control-2').forEach(el => {
      if (el.name !== "correo") {
        el.setAttribute('readonly', true);
      }
    });
    document.getElementById('confirmar-btn').style.display = 'none';
    document.getElementById('cancelar-btn').style.display = 'none';
    document.getElementById('logout-btn').style.display = 'inline-block';
    document.getElementById('editar-btn').style.display = 'inline-block';
  }

  function activarEdicion() {
    document.querySelectorAll('input.form-control-2').forEach(el => {
      if (el.name !== "correo") {
        el.removeAttribute('readonly');
      }
    });
    document.getElementById('confirmar-btn').style.display = 'inline-block';
    document.getElementById('cancelar-btn').style.display = 'inline-block';
    document.getElementById('logout-btn').style.display = 'none';
    document.getElementById('editar-btn').style.display = 'none';
  }

  function cancelarEdicion() {
    activarLectura();
  }
</script>
{% endblock %}
